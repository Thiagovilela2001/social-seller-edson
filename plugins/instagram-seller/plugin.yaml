name: instagram-seller
version: 0.4.0
description: >-
  Ferramentas de envio no Instagram (DM, resposta privada a comentário,
  resposta pública) com as regras da Meta impostas em CÓDIGO — janela de 24h,
  private reply única por comentário, e kill switch. Impõe também as REGRAS DE
  NEGÓCIO (RN-001..RN-013): horário e teto de abordagem proativa, matriz de
  autonomia A0–A3, alegações proibidas, garantia só com fonte aprovada, fila
  humana com SLA e moderação destrutiva autorizada. E a PROTEÇÃO DE DADOS
  (RN-014..RN-018): prazo de guarda por tabela, expurgo automático, minimização
  do texto guardado e direito de acesso e eliminação do titular. Todo bloqueio
  volta com o identificador da regra.

provides_tools:
  - ig_send_dm
  - ig_private_reply
  - ig_reply_comment

provides_hooks:
  - pre_tool_call

# Gate de carregamento: sem token, o plugin nem liga.
requires_env:
  - name: IG_ACCESS_TOKEN
    description: "Token de longa duração da conta profissional do Instagram"
    secret: true
  - name: IG_USER_ID
    description: "ID da conta profissional do Instagram (ig-user-id)"
  - name: META_APP_SECRET
    description: "App Secret do app Meta do cliente — usado para validar assinatura"
    secret: true

# Nenhuma capability privilegiada: não sobrescrevemos tool nativa.
# (Se um dia precisar, declare aqui E conceda INTERATIVAMENTE — em sessão
#  não-TTY as capabilities NÃO são concedidas.)
