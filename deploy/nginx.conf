# Alternativa em nginx — mesma função do Caddyfile.
#
# Use Caddy se puder (TLS automático, config menor).
# Use nginx se o cliente já tem nginx rodando.

upstream hermes_webhook {
    server 127.0.0.1:8644;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name instagram.example.com;

    ssl_certificate     /etc/letsencrypt/live/instagram.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/instagram.example.com/privkey.pem;

    access_log /var/log/nginx/instagram-webhook.log;

    # ------------------------------------------------------------------
    # Handshake da Meta (GET)
    # ------------------------------------------------------------------
    location = /webhooks/instagram {
        if ($request_method = GET) {
            # O verify_token precisa bater. TROQUE pelo valor real.
            if ($arg_hub.verify_token != "SEU_VERIFY_TOKEN_AQUI") {
                return 403 "forbidden";
            }
            if ($arg_hub.mode != "subscribe") {
                return 403 "forbidden";
            }
            # Ecoa o challenge em texto puro. É só isso que a Meta quer.
            default_type text/plain;
            return 200 $arg_hub.challenge;
        }

        # ------------------------------------------------------------------
        # Eventos da Meta (POST)
        # ------------------------------------------------------------------
        if ($request_method = POST) {
            proxy_pass http://hermes_webhook/webhooks/instagram;
        }

        return 405 "method not allowed";
    }

    # Encaminhamento do POST, com o corpo intacto para a validação HMAC.
    location @hermes {
        proxy_pass http://hermes_webhook;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRÍTICO: não deixe o nginx tocar no corpo.
        # Qualquer normalização quebra a assinatura X-Hub-Signature-256.
        proxy_request_buffering on;
        proxy_set_header Content-Length $content_length;

        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location / {
        return 404 "not found";
    }
}
